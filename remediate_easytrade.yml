---
- name: Remediate EasyTrade service
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_namespace: easytrade
    deployment_name: "{{ deployment | default('broker') }}"

  tasks:
    - name: Log remediation start
      debug:
        msg: "Starting remediation of {{ deployment_name }} in {{ target_namespace }}"

    - name: Rollout restart and wait
      command: python3 {{ playbook_dir }}/remediate.py --deployment {{ deployment_name }} --namespace {{ target_namespace }}
      register: result

    - name: Show output
      debug:
        msg: "{{ result.stdout_lines }}"

    - name: Log remediation complete
      debug:
        msg: "Remediation of {{ deployment_name }} complete"