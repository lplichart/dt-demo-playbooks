---
- name: Remediate EasyTrade service
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_namespace: easytrade
    deployment_name: "{{ deployment | default('broker') }}"

  tasks:
    - name: Log remediation start
      debug:
        msg: "Starting remediation of {{ deployment_name }} in {{ target_namespace }}"

    - name: Rollout restart the affected deployment
      kubernetes.core.k8s_rollout_restart:
        kind: Deployment
        name: "{{ deployment_name }}"
        namespace: "{{ target_namespace }}"

    - name: Wait for rollout to complete
      kubernetes.core.k8s_info:
        kind: Deployment
        name: "{{ deployment_name }}"
        namespace: "{{ target_namespace }}"
        wait: yes
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 120

    - name: Log remediation complete
      debug:
        msg: "Remediation of {{ deployment_name }} complete — deployment is available"
